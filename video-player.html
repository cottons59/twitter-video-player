<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器</title>
    
    <!-- Twitter Cards meta tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:site" content="@777chudai">
    <meta name="twitter:title" content="Join me~ Don't just scroll... say hi and let me know you're with me 😊">
    <meta name="twitter:description" content="I see you watching 👀 Don't be shy—tap and come play 💋">
    <meta name="twitter:image" content="https://777chudai.netlify.app/assets/Gp9N6U0bMAA11VR.jpeg">
    <meta name="twitter:player" content="https://777chudai.netlify.app/video-player.html">
    <meta name="twitter:player:width" content="640">
    <meta name="twitter:player:height" content="360">
    <meta name="twitter:player:stream" content="https://777chudai.netlify.app/assets/L6EMI_ctdZSTZ23M.mp4">
    <meta name="twitter:player:stream:content_type" content="video/mp4">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16/9;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            background: transparent;
            z-index: 1;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="loading">加载中...</div>
        <video id="video" muted loop playsinline>
            <source id="video-source" src="https://777chudai.netlify.app/assets/L6EMI_ctdZSTZ23M.mp4" type="video/mp4">
            您的浏览器不支持视频播放
        </video>
        <div class="click-overlay"></div>
    </div>
    
    <script>
        const video = document.getElementById('video');
        const loading = document.querySelector('.loading');
        
        // 当视频加载完成后开始播放
        video.addEventListener('loadedmetadata', () => {
            loading.style.display = 'none';
            video.play().catch(err => {
                console.error('Error playing video:', err);
            });
        });
        
        // 视频加载错误处理
        video.addEventListener('error', () => {
            loading.textContent = '视频加载失败';
        });
        
        // 点击时跳转到目标链接
        const overlay = document.querySelector('.click-overlay');
        overlay.addEventListener('click', () => {
            window.parent.location.href = 'https://linktr.ee/chudai888';
        });
    </script>
</body>
</html>
